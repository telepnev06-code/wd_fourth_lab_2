<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иван Телепнев — Веб-разработчик</title>
    <link rel="stylesheet" href="style.css">
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Крутой многослойный фон -->
    <div class="bg-grid"></div>
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>

    <!-- Основная секция -->
    <section class="hero-section">
        <div class="hero-container">
            
            <!-- Левый блок с контентом -->
            <div class="hero-content">
                <div class="hero-badge">
                    <span class="badge-dot"></span>
                    <span>Открыт к проектам</span>
                </div>

                <h1 class="hero-title">
                    Привет! Я Иван <br>
                    <span class="gradient-text">ВЕБ-РАЗРАБОТЧИК</span>
                </h1>

                <h2 class="hero-subtitle">
                    Создаю современные веб-приложения и интерфейсы
                </h2>

                <p class="hero-description">
                    Специализируюсь на разработке сайтов, проектировании архитектуры и качественной верстке. Превращаю идеи в надежные цифровые продукты.
                </p>
                
                <div class="hero-actions">
                    <a href="#contact" class="btn-primary">
                        <span>Связаться со мной</span>
                        <i class="fa-solid fa-bolt"></i>
                    </a>
                </div>
            </div>

            <!-- Правый блок с аватаром -->
            <div class="hero-image-wrapper">
                <div class="avatar-card">
                    <div class="animated-border"></div>
                    <img src="photo.jpg" alt="Иван — Веб-разработчик" class="hero-photo">
                    
                </div>
            </div>

        </div>
    </section>

</body>
</html>
